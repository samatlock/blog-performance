<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5FE;--card:#FFFFFF;--fg:#2F2F2F;--muted:#6F6F72;--line:#BCCEF5;--grid:#E7EDFD;--blue:#294175;--violet:#513986;--good:#006368;--bad:#B3261E;--radius:8px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45}
.bp{max-width:1100px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:32px;font-weight:700;color:var(--blue)}
.take{margin:6px 0 0}
.take a{color:inherit}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
.filter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin:0}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px}
.head{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) 18px;gap:16px;padding:0 20px;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) 18px;align-items:center;gap:16px;padding:14px 20px}
summary::-webkit-details-marker{display:none}
summary:hover{background:color-mix(in srgb,var(--blue) 4%,transparent)}
.caret{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);justify-self:end;transition:transform .25s ease}
details[open] .caret{transform:rotate(225deg)}
.post{font-weight:600;line-height:1.3;display:block}
.meta{margin:2px 0 0;font-size:13px;color:var(--muted)}
.cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.lab{font-size:13px;color:var(--muted)}
.line{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.flat{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.spark{display:block;width:72px;height:20px;margin-top:2px}
.open{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.open h3{margin:14px 0 0;font-size:16px;font-weight:600;color:var(--blue)}
.chart{position:relative;min-height:170px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:inherit}
.chart .tick line{stroke:var(--grid)}
.chart .domain{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 16px rgba(14,20,37,.12);border-radius:var(--radius);padding:6px 10px;font-size:12px;white-space:nowrap}
.tip b{display:block}
.tip span{color:var(--muted)}
.empty{font-size:13px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--muted) 12%,transparent)}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent)}
.chip.warn{background:color-mix(in srgb,#E0A100 22%,transparent)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
a.read{font-size:13px;color:var(--blue)}
.foot{font-size:13px;color:var(--muted)}
@media (max-width:640px){summary,.head{grid-template-columns:repeat(3,minmax(0,1fr)) 18px}.name{grid-column:1/-1}.head{display:none}}
</style>
</head>
<body>
<div class="bp">

  </div>
  <div class="head" aria-hidden="true"><span>Post</span><span>Impressions</span><span>Clicks</span><span>Avg position</span><span></span></div>
  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</div>

      tip.style.left = Math.max(0, Math.min(box.clientWidth - tw, px - tw / 2)) + 'px'; tip.style.top = '-8px';
    });
    hit.addEventListener('pointerleave', function () { tip.style.display = 'none'; });
    if (n < 2) box.append(el('p', 'empty', 'The trend line starts once there are two months of data.'));
  }
  function table(rows) {
    var w = el('div', 'tw'), t = el('table'), hr = t.createTHead().insertRow();
    ['Month', 'Impressions', 'Clicks', 'Click rate', 'Avg position', 'AI citing'].forEach(function (h) { hr.append(el('th', null, h)); });
    var b = t.createTBody();
    rows.slice().reverse().forEach(function (r) {
      var tr = b.insertRow();
      [fmtMonth(r.month), fmtInt(r.impressions), fmtInt(r.clicks), r.ctr === null ? '—' : fmtPct(r.ctr), r.position === null ? '—' : r.position.toFixed(1), r.ai_engines || 'None seen'].forEach(function (v) { tr.insertCell().textContent = v; });
    });
    w.append(t); return w;
  }
  function chip(t, c) { return el('span', 'chip' + (c ? ' ' + c : ''), t); }

  function render() {
    var list = document.getElementById('list'), who = sel.value.trim().toLowerCase();
    list.replaceChildren();
    D.posts.filter(function (p) { return !who || (p.author || '').toLowerCase().indexOf(who) !== -1; }).sort(function (a, b) { return a.published < b.published ? 1 : -1; }).forEach(function (p) {
      var rows = byUrl.get(p.url) || [], c = change(p.url), has = p.impressions !== null;
      var det = el('details'), sum = el('summary'), name = el('div', 'name');
      name.append(el('span', 'post', p.title), el('p', 'meta', (p.author || 'Unknown author') + (p.published ? ' · ' + fmtDay(p.published) : '')));
      var caret = el('span', 'caret'); caret.setAttribute('aria-hidden', 'true');
      sum.append(name,
        cell('Impressions', has ? fmtInt(p.impressions) : '—', c.imp, 'num', spark(rows)),
        cell('Clicks', has ? fmtInt(p.clicks) : '—', c.clk, 'num'),
        cell('Avg position', has && p.position !== null ? p.position.toFixed(1) : '—', c.pos, 'pos'),
        caret);
      var open = el('div', 'open'), box = el('div', 'chart'), chips = el('div', 'chips');
      if (p.yoast_seo) chips.append(chip('Yoast SEO: ' + p.yoast_seo, yoastCls[p.yoast_seo]));
      if (p.yoast_read) chips.append(chip('Readability: ' + p.yoast_read, yoastCls[p.yoast_read]));
      if (p.headline_score !== null) chips.append(chip('Headline score ' + p.headline_score));
      if (p.keyphrase) chips.append(chip('Keyphrase: ' + p.keyphrase));
      chips.append(chip(p.ai_citations ? 'AI: ' + p.ai_citations : 'AI citations: none seen yet'));
      open.append(el('h3', null, 'Search trend' + (p.period ? ' (latest: ' + p.period + ')' : '')), box, el('h3', null, 'Month by month'), rows.length ? table(rows) : chip('No monthly data yet'), el('h3', null, 'Post details'), chips);
      if (safe(p.url)) { var a = el('a', 'read', 'Read the post on sep.com'); a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; open.append(a); }
      det.append(sum, open);
      det.addEventListener('toggle', function () { if (det.open) chart(box, rows, p.title); });
      list.append(det);
    });
  }
  render();
})();
</script>
